# e2e override: throwaway DB on tmpfs, FakeLlm, fixture personas seeded by the migrate step (docs/07 §4.1, docs/14 §5).
services:
  db:
    volumes: !reset []
    tmpfs: [/var/lib/postgresql]
  migrate:
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SEED_FIXTURES: "1"
  api:
    environment:
      AGENT_PROVIDER: fake
      CLOCK_FIXED: ${CLOCK_FIXED:-}
